services:
  db:
    image: postgres:16-alpine
    container_name: iqac_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iqac_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iqac_secret}
      POSTGRES_DB: ${POSTGRES_DB:-iqac_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iqac_user} -d ${POSTGRES_DB:-iqac_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iqac_redis
    restart: unless-stopped
    ports:  
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iqac_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-iqac_user}:${POSTGRES_PASSWORD:-iqac_secret}@db:5432/${POSTGRES_DB:-iqac_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme_in_production_32chars_min}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAILS_FROM: ${EMAILS_FROM:-iqac@ganpatuniversity.ac.in}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-Ganpat University IQAC Platform}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL_OPENAI: ${AI_MODEL_OPENAI:-gpt-4o-mini}
      AI_MODEL_OLLAMA: ${AI_MODEL_OLLAMA:-llama3.1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_EMBEDDING_MODEL_OPENAI: ${RAG_EMBEDDING_MODEL_OPENAI:-text-embedding-3-small}
      RAG_EMBEDDING_MODEL_OLLAMA: ${RAG_EMBEDDING_MODEL_OLLAMA:-nomic-embed-text:latest}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-150}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_FILE_SIZE_MB: ${RAG_MAX_FILE_SIZE_MB:-50}
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: iqac_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: iqac_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    profiles:
      - production

volumes:
  postgres_data:
  upload_data: